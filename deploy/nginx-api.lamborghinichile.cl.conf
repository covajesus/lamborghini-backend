# Nginx reverse proxy for FastAPI (lb) on port 7776
# Install:
#   sudo cp deploy/nginx-api.lamborghinichile.cl.conf /etc/nginx/sites-available/api.lamborghinichile.cl
#   sudo ln -sf /etc/nginx/sites-available/api.lamborghinichile.cl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.lamborghinichile.cl;

    location / {
        proxy_pass http://127.0.0.1:7776;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

