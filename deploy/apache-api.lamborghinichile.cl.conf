# Apache reverse proxy for FastAPI (lb) on port 7776
# Install (Ubuntu + Apache):
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo cp deploy/apache-api.lamborghinichile.cl.conf /etc/apache2/sites-available/api.lamborghinichile.cl.conf
#   sudo a2ensite api.lamborghinichile.cl.conf
#   sudo systemctl reload apache2
#
# If this vhost already exists in Plesk/cPanel, paste the ProxyPass block
# inside that VirtualHost instead of creating a second site.

<VirtualHost *:80>
    ServerName api.lamborghinichile.cl

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:7776/
    ProxyPassReverse / http://127.0.0.1:7776/

    ErrorLog ${APACHE_LOG_DIR}/api.lamborghinichile.cl-error.log
    CustomLog ${APACHE_LOG_DIR}/api.lamborghinichile.cl-access.log combined
</VirtualHost>

# HTTPS — adjust SSLCertificateFile/KeyFile to your real cert paths
# (Let's Encrypt / Plesk / cPanel).
# <VirtualHost *:443>
#     ServerName api.lamborghinichile.cl
