#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/api.lamborghinichile.cl/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/api.lamborghinichile.cl/privkey.pem
#
#     ProxyPreserveHost On
#     RequestHeader set X-Forwarded-Proto "https"
#     ProxyPass / http://127.0.0.1:7776/
